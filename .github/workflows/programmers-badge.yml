name: Update Programmers Badge

on:
  push:
    branches:
      - main
    paths:
      - "프로그래머스/**"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-badge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate badge
        run: node scripts/generate-programmers-badge.js

      - name: Commit badge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add badges/programmers.svg

          git diff --cached --quiet || git commit -m "chore: update programmers stats badge"
          git push
