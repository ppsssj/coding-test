  <text x="228" y="75" fill="#d1d5db" font-family="Arial, sans-serif" font-size="13">Lv.2</text>
  <text x="276" y="75" fill="#ffffff" font-family="Arial, sans-serif" font-size="15" font-weight="700">0</text>

  <text x="331" y="75" fill="#d1d5db" font-family="Arial, sans-serif" font-size="13">Lv.3+</text>
  <text x="387" y="75" fill="#ffffff" font-family="Arial, sans-serif" font-size="15" font-weight="700">0</text>

  <text x="22" y="99"
